name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to a pull request cancels its older run; runs on main are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: node --check plugins/cbox-brain/scripts/brain.mjs
      - run: bash -n plugins/cbox-brain/scripts/brain-hook.sh
      - run: node --test scripts/*.test.mjs
